name: NAS Candidate Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nas-candidate-validation
  cancel-in-progress: false

jobs:
  candidate-validation:
    name: Build, scan, and test candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REGISTRY: 127.0.0.1:3430
      IMAGE_REPOSITORY: lauqnan14/deezspotag-candidate
      IMAGE_TAG: candidate-${{ gitea.sha }}
      TEST_CONTAINER: deezspotag-candidate-test
      TEST_DATA_VOLUME: deezspotag-candidate-test-data

    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Authenticate to Gitea Container Registry
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$REGISTRY_TOKEN" |
              docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Gitea Container Registry authentication failed after five attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Build candidate image
        shell: bash
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker build \
            --pull \
            --build-arg "DEEZSPOTAG_BUILD_VERSION=${{ gitea.sha }}" \
            --tag "$image" \
            .

      - name: Push candidate image to Gitea
        shell: bash
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker push "$image"

      - name: Scan candidate image with Trivy
        shell: bash
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker pull aquasec/trivy:0.67.2
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume deezspotag-trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.67.2 image \
            --docker-host unix:///var/run/docker.sock \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --scanners vuln \
            "$image"

      - name: Deploy isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker rm --force "$TEST_CONTAINER" 2>/dev/null || true
          docker volume rm "$TEST_DATA_VOLUME" 2>/dev/null || true
          docker volume create "$TEST_DATA_VOLUME"
          docker run --detach \
            --name "$TEST_CONTAINER" \
            --label deezspotag.validation=candidate \
            --publish 127.0.0.1:18668:8668 \
            --user 1000:1000 \
            --env ASPNETCORE_URLS=http://0.0.0.0:8668 \
            --env DEEZSPOTAG_BOOTSTRAP_USER=CandidateValidation \
            --env "DEEZSPOTAG_BOOTSTRAP_PASS=CandidateOnly-${{ gitea.run_id }}-9x!" \
            --env DEEZSPOTAG_DATA_DIR=/data \
            --env DEEZSPOTAG_CONFIG_DIR=/data \
            --env DEEZSPOTAG_DATA_PROTECTION_KEYS_DIR=/data/security/data-protection-keys \
            --env DEEZSPOTAG_APPLE_WRAPPER_MODE=external \
            --env DEEZSPOTAG_APPLE_WRAPPER_HOST=127.0.0.1 \
            --volume "$TEST_DATA_VOLUME:/data" \
            --tmpfs /downloads:uid=1000,gid=1000,mode=0770 \
            --tmpfs /review:uid=1000,gid=1000,mode=0770 \
            --tmpfs /library:uid=1000,gid=1000,mode=0770 \
            "$image"

      - name: Verify isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if docker exec "$TEST_CONTAINER" \
              curl --fail --silent --show-error http://127.0.0.1:8668/health; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$TEST_CONTAINER")" != "true" ]; then
              docker logs "$TEST_CONTAINER"
              exit 1
            fi
            sleep 2
          done
          docker logs "$TEST_CONTAINER"
          echo "Candidate did not become healthy within four minutes." >&2
          exit 1

      - name: Clean up isolated candidate
        if: always()
        shell: bash
        run: |
          set +e
          image="$REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker logs "$TEST_CONTAINER" > candidate-container.log 2>&1
          docker rm --force "$TEST_CONTAINER"
          docker volume rm "$TEST_DATA_VOLUME"
          docker image rm "$image"
          docker logout "$REGISTRY"
          exit 0

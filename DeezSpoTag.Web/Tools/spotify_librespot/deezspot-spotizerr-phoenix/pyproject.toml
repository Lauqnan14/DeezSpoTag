[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deezspot-spotizerr-phoenix"
version = "1.2.0"
description = "Downloads songs, albums or playlists from deezer and spotify (clone from deezloader)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GNU Affero General Public License v3"}
authors = [
    {name = "spotizerr-phoenix", email = "spotizerrphoenix@proton.me"}
]

dependencies = [
    "mutagen==1.47.0",
    "pycryptodome==3.23.0",
    "requests==2.33.0",
    # Kept in step with spotizerr-phoenix/requirements.txt. 2.8.0 fixes three streaming-decoder
    # advisories including GHSA-gh4c-6fx4-qh6g. This project runs an HTTP server, so unlike the
    # client-side librespot code it could in principle be on the receiving end; nothing here streams
    # a response today, and the pin is raised so that stays true if that changes.
    "urllib3==2.8.0",
    "zeroconf==0.149.16",
    "tqdm==4.67.1",
    "fastapi==0.135.2",
    "uvicorn[standard]==0.35.0",
    "librespot-spotizerr-phoenix @ file:../spotizerr-phoenix",
    "rapidfuzz==3.13.0",
    "spotipy==2.25.2"
]

[project.urls]
Homepage = "https://lavaforge.org/spotizerrphoenix/deezspot-spotizerr-phoenix"
Repository = "https://lavaforge.org/spotizerrphoenix/deezspot-spotizerr-phoenix.git"
Documentation = "https://lavaforge.org/spotizerrphoenix/deezspot-spotizerr-phoenix/src/branch/main/README.md"

[tool.setuptools.packages.find]
include = ["deezspot", "deezspot.*"]

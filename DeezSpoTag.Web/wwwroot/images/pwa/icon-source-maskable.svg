<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">

<!--
  DeezSpoTag PWA icon source ("maskable" purpose).

  Same mark as icon-source.svg, scaled to 3.2 so the artwork sits inside the 80%
  safe circle (mark half-diagonal 190.6px <= 205px safe radius) while the
  #0f172a background stays full bleed for the platform's adaptive-icon mask.

  Regenerate (run from this directory):
    inkscape -w 512 -h 512 -o icon-maskable-512.png icon-source-maskable.svg
-->

<defs>

<linearGradient id="pwaIconMaskableGrad" x1="0%" y1="0%" x2="100%" y2="100%">

<stop offset="0%" style="stop-color:#00bfff;stop-opacity:1" />

<stop offset="100%" style="stop-color:#1e90ff;stop-opacity:1" />

</linearGradient>

<filter id="pwaIconMaskableGlow" x="-25%" y="-25%" width="150%" height="150%">

<feGaussianBlur stdDeviation="3" result="coloredBlur"/>

<feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>

</filter>

</defs>

<rect x="0" y="0" width="512" height="512" fill="#0f172a"/>

<g transform="translate(256,256) scale(3.2)">

<path d="M-45,0 L-22.5,-39 L22.5,-39 L45,0 L22.5,39 L-22.5,39 Z" fill="none" stroke="url(#pwaIconMaskableGrad)" stroke-width="2" filter="url(#pwaIconMaskableGlow)"/>

<path d="M-35,0 L-17.5,-30 L17.5,-30 L35,0 L17.5,30 L-17.5,30 Z" fill="none" stroke="url(#pwaIconMaskableGrad)" stroke-width="1" opacity="0.5"/>

<g filter="url(#pwaIconMaskableGlow)">

<!-- Nudged +2.5 so the bar group is centred on the hexagon centreline; see
     icon-source.svg for why the logo's own bar positions are off-centre. -->
<g transform="translate(2.5,0)">

<rect x="-20" y="-15" width="5" height="30" fill="#00bfff"/>

<rect x="-10" y="-20" width="5" height="40" fill="#0099cc"/>

<rect x="0" y="-12" width="5" height="24" fill="#0099cc"/>

<rect x="10" y="-18" width="5" height="36" fill="#1e90ff"/>

</g>

</g>

</g>

</svg>
